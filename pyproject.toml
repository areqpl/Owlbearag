[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "owlbearag"
version = "2.1.0"
description = "Multi-node RAG, PyTorch vector reranker, and GPU management console"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "owlyyy", email = "owlyyy@cachyos.local"}
]
keywords = [
    "rag", "pytorch", "reranker", "gpu-telemetry", "nvidia-smi",
    "ollama", "cloudflare-vps", "pyqt6", "cli", "multi-node"
]
dependencies = [
    "PyQt6>=6.5.0",
    "rich>=13.0.0",
    "torch>=2.0.0",
]

[project.scripts]
owlbearag = "owlbearag.gui:main"
owlbearag-cli = "owlbearag.cli:main"

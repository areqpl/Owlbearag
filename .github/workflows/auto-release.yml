name: Automated Release & Rolling Build

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  schedule:
    - cron: '0 2 * * *' # Daily build check at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-release:
    name: Build & Publish Release Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Packaging Dependencies
        run: |
          python -m pip install --upgrade pip build setuptools wheel

      - name: Build Wheel & Source Distribution
        run: |
          python -m build

      - name: Generate Changelog & Release Tag
        id: tag_name
        run: |
          VERSION=$(python -c "import owlbearag; print(owlbearag.__version__)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building automated release for Owlbearag v$VERSION..."

      - name: Publish Automated Rolling Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.tag_name.outputs.version }}"
          name: "Owlbearag v${{ steps.tag_name.outputs.version }} (Automated Release)"
          body: |
            ## 🦉 Owlbearag v${{ steps.tag_name.outputs.version }} Release
            
            This is an automated build release generated from the latest codebase commits on `main`.

            ### 🚀 Pre-Built Packages Available
            - Download the `.whl` package below to install instantly:
              ```bash
              pip install Owlbearag-${{ steps.tag_name.outputs.version }}-py3-none-any.whl
              ```
            - Or install directly from GitHub:
              ```bash
              pip install git+https://github.com/areqpl/Owlbearag.git
              ```
          files: |
            dist/*.whl
            dist/*.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Automated Continuous Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-release:
    name: Build & Publish Release Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip build setuptools wheel

      - name: Build Wheel & Source Distribution
        run: |
          python -m build

      - name: Extract Version
        id: get_version
        run: |
          VERSION=$(python -c "import owlbearag; print(owlbearag.__version__)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.get_version.outputs.version }}"
          name: "Owlbearag v${{ steps.get_version.outputs.version }}"
          body: |
            Continuous automated release built from the latest codebase commits on `main`.

            ### Quick Installation
            ```bash
            pip install git+https://github.com/areqpl/Owlbearag.git
            ```
          files: |
            dist/*.whl
            dist/*.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
